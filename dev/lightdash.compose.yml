# Layered on top of .lightdash/examples/full-jaffle-shop-demo/docker-compose.yml.
# Relative paths resolve from that folder.
services:
  lightdash:
    image: lightdash/lightdash:${LIGHTDASH_VERSION}
    build: !reset null
    user: root
    entrypoint: /usr/bin/entrypoint.sh
    command: pnpm start
    volumes:
      - ../../../dev/entrypoint.sh:/usr/bin/entrypoint.sh:ro
    depends_on:
      - minio
    environment:
      - SITE_URL=http://localhost:8080
      - SCHEDULER_ENABLED=true
      - GROUPS_ENABLED=true
      - DBT_DEMO_DIR=/usr/app
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=default
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_FORCE_PATH_STYLE=true

  # Lightdash requires S3-compatible storage; same setup as upstream docker-compose.yml.
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    entrypoint: /init-minio.sh
    volumes:
      - ../../docker/init-minio.sh:/init-minio.sh:ro
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_DEFAULT_BUCKETS=default

  # For the MCP server, not Lightdash.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
