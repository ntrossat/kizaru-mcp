[project]
name = "lightdash-mcp"
version = "0.1.0"
description = "MCP server for Lightdash admin, governance and content lifecycle"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5",
    "cryptography>=43",
]

[project.scripts]
lightdash-mcp = "lightdash_mcp.server:main"

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.26",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
