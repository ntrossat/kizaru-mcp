[project]
name = "kizaru-mcp"
version = "0.1.0"
description = "MCP server for Lightdash: data queries, admin, governance and content lifecycle"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nicolas Trossat" }]
keywords = ["mcp", "lightdash", "oauth", "semantic-layer"]
requires-python = ">=3.15"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5",
    "cryptography>=43",
]

[project.urls]
Repository = "https://github.com/ntrossat/kizaru-mcp"
Issues = "https://github.com/ntrossat/kizaru-mcp/issues"

[project.scripts]
kizaru-mcp = "kizaru_mcp.server:main"

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.26",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py315"

[tool.ruff.lint.per-file-ignores]
# The integration tests drive the server over blocking HTTP on purpose.
"tests/integration/*" = ["ASYNC210"]
